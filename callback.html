<!DOCTYPE html>
  <html lang="tr">
  <head>
  <meta charset="UTF-8">
  <title>Yetkilendirme - Story Time Paylasim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.6}
code{display:block;background:#f4f4f5;border:1px solid #ddd;border-radius:6px;padding:14px;margin:12px 0;word-break:break-all;font-size:15px}
button{background:#fe2c55;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer}
  .err{color:#b00}
</style>
  </head>
  <body>
  <h1>Yetkilendirme tamamlandi</h1>
  <p>Asagidaki kodu kopyalayip uygulamaniza yapistirin. Bu kod kisa surede gecersiz olur.</p>
  <code id="out">Kod okunuyor...</code>
<button id="cp">Kodu kopyala</button>
  <script>
  var p = new URLSearchParams(location.search);
var code = p.get('code');
var err = p.get('error');
var out = document.getElementById('out');
if (code) { out.textContent = code; }
else if (err) { out.textContent = 'Hata: ' + err + ' - ' + (p.get('error_description') || ''); out.className = 'err'; }
  else { out.textContent = 'URL icinde kod bulunamadi.'; }
document.getElementById('cp').onclick = function () {
  navigator.clipboard.writeText(out.textContent).then(function () { document.getElementById('cp').textContent = 'Kopyalandi'; });
};
</script>
  </body>
  </html>
